<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zarakhan Boutique Birmingham | Asian bridal, party &amp; festive wear</title>
<meta name="description" content="Asian bridal, party and festive wear from Zarakhan Boutique, Birmingham. Shop online, click and collect, or visit the store.">
<meta property="og:title" content="Zarakhan Boutique Birmingham | Asian bridal, party &amp; festive wear">
<meta property="og:description" content="Asian bridal, party and festive wear from Zarakhan Boutique, Birmingham. Shop online, click and collect, or visit the store.">
<meta property="og:image" content="img/3.jpg">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=Playfair+Display:ital,wght@1,400;1,500&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#140A10;--ink:#F5E7DC;--muted:#A8918A;--line:#33212C;--soft:#21131B;--accent:#E0AE62;--on-accent:#140A10;--dark:#0B0509;--light:#F5E7DC;--disp:'Syne',system-ui,sans-serif;--serif:'Playfair Display',Georgia,serif;--sans:'Manrope',system-ui,sans-serif;--dw:800;--dls:-.04em;--htt:uppercase;--ir:0px;--hsize:clamp(60px,13.2vw,230px);--wsize:19vw;--mono:'JetBrains Mono',ui-monospace,monospace;--ease:cubic-bezier(.7,0,.2,1);--out:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.loading{overflow:hidden}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent);color:var(--on-accent)}
.mono{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}
.serif{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.01em}
.outline{color:transparent;-webkit-text-stroke:1.5px currentColor}
.px{padding-left:max(20px,4vw,env(safe-area-inset-left));padding-right:max(20px,4vw,env(safe-area-inset-right))}

/* ---------- preloader ---------- */
#pre{position:fixed;inset:0;z-index:200;background:var(--dark);color:var(--light);display:flex;flex-direction:column;justify-content:space-between;padding:28px max(20px,4vw);transition:transform 1.1s var(--ease)}
#pre.gone{transform:translateY(-100%)}
#pre .mark{white-space:nowrap;font-family:var(--disp);font-size:clamp(56px,13vw,220px);line-height:.85;font-weight:var(--dw);letter-spacing:var(--dls);overflow:hidden}
#pre .mark span{display:inline-block;transform:translateY(105%);animation:up .9s var(--out) forwards}
#pre .bar{height:1px;background:color-mix(in srgb,var(--light) 20%,transparent);position:relative;margin-top:18px}
#pre .bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent)}
#pre .row{display:flex;justify-content:space-between;align-items:end}
#pre .pct{font-family:var(--disp);font-size:clamp(48px,9vw,120px);line-height:.9;font-weight:var(--dw);font-variant-numeric:tabular-nums}
@keyframes up{to{transform:none}}

/* ---------- cursor ---------- */
#cur{position:fixed;left:0;top:0;width:12px;height:12px;border-radius:50%;background:var(--accent);z-index:150;pointer-events:none;transform:translate(-50%,-50%);transition:width .35s var(--out),height .35s var(--out),background .35s;display:grid;place-items:center;mix-blend-mode:normal}
#cur span{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--on-accent);opacity:0;transition:opacity .2s}
#cur.big{width:92px;height:92px}#cur.big span{opacity:1}
@media(hover:none),(pointer:coarse){#cur{display:none}}

/* ---------- header ---------- */
header.hd{position:fixed;top:0;left:0;right:0;z-index:90;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:16px;color:var(--light);mix-blend-mode:difference}
header.hd .logo{font-family:var(--disp);font-weight:var(--dw);font-size:22px;letter-spacing:var(--lls,0)}
header.hd .logo sup{font-family:var(--mono);font-size:9px;margin-left:2px}
header.hd nav{display:flex;gap:26px}
header.hd .right{display:flex;justify-content:flex-end;align-items:center;gap:20px}
header.hd a.l,header.hd button.l{position:relative}
header.hd a.l::after,header.hd button.l::after{content:"";position:absolute;left:0;right:100%;bottom:-3px;height:1px;background:currentColor;transition:right .4s var(--out)}
header.hd a.l:hover::after,header.hd button.l:hover::after{right:0}
@media(max-width:760px){header.hd nav,header.hd .clock{display:none}header.hd{grid-template-columns:1fr auto}}
.strip{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:85;background:var(--dark);color:var(--light);border:1px solid color-mix(in srgb,var(--light) 18%,transparent);border-radius:999px;padding:8px 14px;white-space:nowrap;max-width:calc(100vw - 100px);overflow:hidden;text-overflow:ellipsis;transition:opacity .4s}
.strip b{color:var(--accent)}

/* ---------- hero ---------- */
.hero{position:relative;height:100svh;min-height:560px;overflow:hidden;background:var(--dark);color:var(--light)}
.hero .slides,.hero .slides img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .slides img{opacity:0;transform:scale(1.15);transition:opacity 1.4s ease,transform 7s linear;object-position:var(--hpos,center 25%)}
.hero .slides img.on{opacity:1;transform:scale(1.02)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,.15) 55%,rgba(0,0,0,.78) 100%);pointer-events:none}
.hero .in{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:max(70px,9vh)}
.hero h1{font-family:var(--disp);font-weight:var(--dw);letter-spacing:var(--dls);line-height:.82;font-size:var(--hsize,clamp(64px,15vw,250px));text-transform:var(--htt,none);white-space:nowrap}
.hero h1 .ch{display:inline-block;transform:translateY(110%);opacity:0;transition:transform 1.1s var(--out),opacity .6s}
.hero h1 .ln{display:block;overflow:hidden;padding-bottom:.04em}
.ready .hero h1 .ch{transform:none;opacity:1}
.hero .meta{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-top:22px;flex-wrap:wrap}
.hero .meta p{max-width:38ch;font-size:clamp(15px,1.3vw,18px);opacity:.88}
.hero .tl{position:absolute;top:96px;z-index:2;display:flex;justify-content:space-between;left:0;right:0}
.hero .cnt{font-variant-numeric:tabular-nums}
.hero .scroll{display:flex;align-items:center;gap:10px}
.hero .scroll i{width:1px;height:38px;background:currentColor;opacity:.6;transform-origin:top;animation:drip 1.8s var(--ease) infinite}
@keyframes drip{0%{transform:scaleY(0)}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.fade{opacity:0;transform:translateY(20px);transition:opacity 1s var(--out) .9s,transform 1s var(--out) .9s}
.ready .fade{opacity:1;transform:none}

/* ---------- manifesto ---------- */
.mani{padding:22vh 0 18vh;position:relative}
.mani .lab{display:flex;justify-content:space-between;margin-bottom:6vh;color:var(--muted)}
.mani p.big{font-family:var(--sans);font-weight:var(--mw,500);font-size:clamp(30px,4.6vw,76px);line-height:1.08;letter-spacing:-.03em;max-width:20ch}
.mani p.big .w{color:color-mix(in srgb,var(--ink) 14%,transparent);transition:color .35s}
.mani p.big .w.on{color:var(--ink)}
.mani p.big .w.serif.on{color:var(--accent)}
.mani .side{display:grid;grid-template-columns:1fr 1fr;gap:4vw;margin-top:8vh;align-items:end}
.mani .side p{max-width:42ch;color:var(--muted);font-size:17px}
@media(max-width:760px){.mani .side{grid-template-columns:1fr}}

/* ---------- section heading ---------- */
.sec{position:relative}
.shead{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:5vh}
.shead h2{font-family:var(--disp);font-weight:var(--dw);letter-spacing:var(--dls);font-size:clamp(54px,10vw,170px);line-height:.85;text-transform:var(--htt,none)}
.shead h2 .serif{font-family:var(--serif);text-transform:none;font-weight:400;letter-spacing:-.02em}
.shead .note{max-width:34ch;color:var(--muted)}
.sline{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:14px 0;color:var(--muted)}

/* ---------- horizontal collection ---------- */
.hz{position:relative}
.hz .pin{position:sticky;top:0;height:100svh;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.hz .track{display:flex;gap:2.4vw;will-change:transform;padding-left:max(20px,4vw);padding-right:max(20px,4vw);align-items:flex-end}
.hz .ghost{position:absolute;left:0;top:50%;transform:translateY(-50%);font-family:var(--disp);font-weight:var(--dw);font-size:28vw;line-height:.8;white-space:nowrap;color:transparent;-webkit-text-stroke:1px color-mix(in srgb,var(--ink) 16%,transparent);pointer-events:none;text-transform:var(--htt,none);letter-spacing:var(--dls)}
.pc{flex:0 0 auto;width:clamp(260px,27vw,420px);position:relative;cursor:pointer}
.pc:nth-child(even){margin-bottom:8vh}
.pc .ph{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--soft);border-radius:var(--ir,0)}
.pc .ph img{width:100%;height:100%;object-fit:cover;transform:scale(1.08);transition:transform 1.4s var(--out),filter .6s}
.pc:hover .ph img{transform:scale(1)}
.pc .ix{position:absolute;left:14px;top:12px;color:#fff;mix-blend-mode:difference}
.pc .tg{position:absolute;right:12px;top:10px;background:var(--accent);color:var(--on-accent);padding:5px 9px;border-radius:999px}
.pc .add{position:absolute;right:12px;bottom:12px;width:52px;height:52px;border-radius:50%;background:var(--light);color:var(--dark);font-size:24px;display:grid;place-items:center;transform:scale(0);transition:transform .45s var(--out)}
.pc:hover .add,.pc:focus-within .add{transform:scale(1)}
@media(hover:none){.pc .add{transform:scale(1)}}
.pc .cap{display:flex;justify-content:space-between;gap:12px;margin-top:14px;align-items:baseline}
.pc h3{font-family:var(--sans);font-weight:600;font-size:clamp(17px,1.4vw,21px);letter-spacing:-.01em}
.pc .pr{font-family:var(--mono);font-size:13px;white-space:nowrap}
.pc .was{text-decoration:line-through;opacity:.5;margin-left:6px}
.pc .sub{color:var(--muted);font-size:14px;margin-top:2px}
.hz .bot{position:absolute;left:0;right:0;bottom:28px;display:flex;justify-content:space-between;align-items:center;gap:20px}
.hz .prog{flex:1;height:1px;background:var(--line);position:relative;max-width:40vw}
.hz .prog i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);width:0}
@media(max-width:760px){.hz .pin{position:relative;height:auto;padding:12vh 0 8vh}.hz{height:auto!important}.hz .track{overflow-x:auto;scroll-snap-type:x mandatory;transform:none!important;scrollbar-width:none;padding-bottom:10px}.hz .track::-webkit-scrollbar{display:none}.pc{width:76vw;scroll-snap-align:start}.pc:nth-child(even){margin-bottom:0}.hz .bot{position:static;margin-top:20px}.hz .ghost{font-size:44vw;top:22%}}

/* ---------- hover index list ---------- */
.idx{padding:16vh 0}
.idx ul{list-style:none;border-top:1px solid var(--line)}
.idx li{border-bottom:1px solid var(--line)}
.idx li button{width:100%;display:grid;grid-template-columns:60px 1fr auto;align-items:center;gap:20px;padding:clamp(16px,2.4vw,30px) 0;text-align:left;position:relative;overflow:hidden}
.idx li .nm{font-family:var(--disp);font-weight:var(--dw);font-size:clamp(34px,6.4vw,104px);line-height:.95;letter-spacing:var(--dls);text-transform:var(--htt,none);transition:transform .6s var(--out),color .4s}
.idx li button:hover .nm{transform:translateX(2vw);color:var(--accent)}
.idx li .r{text-align:right;color:var(--muted)}
.idx li button::before{content:"";position:absolute;inset:0;background:var(--soft);transform:scaleY(0);transform-origin:bottom;transition:transform .5s var(--out);z-index:-1}
.idx li button:hover::before{transform:scaleY(1)}
#flo{position:fixed;left:0;top:0;width:min(300px,24vw);aspect-ratio:3/4;pointer-events:none;z-index:80;overflow:hidden;opacity:0;transform:translate(-50%,-50%) scale(.6) rotate(-6deg);transition:opacity .35s,transform .5s var(--out);border-radius:var(--ir,0)}
#flo.on{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-3deg)}
#flo img{width:100%;height:100%;object-fit:cover}
@media(max-width:760px){.idx li button{grid-template-columns:34px 1fr}.idx li .r{grid-column:2;text-align:left;margin-top:-8px}#flo{display:none}}

/* ---------- dots field ---------- */
.dots{position:relative;height:100svh;min-height:560px;background:var(--dark);color:var(--light);overflow:hidden}
.dots canvas{position:absolute;inset:0;width:100%;height:100%}
.dots .ov{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding-top:12vh;padding-bottom:6vh}
.dots .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.dots .stats b{display:block;font-family:var(--disp);font-weight:var(--dw);font-size:clamp(40px,6vw,96px);line-height:.9;letter-spacing:var(--dls)}
.dots .stats span{color:color-mix(in srgb,var(--light) 60%,transparent)}
.dots .hint{display:flex;justify-content:space-between;color:color-mix(in srgb,var(--light) 60%,transparent)}

/* ---------- marquee ---------- */
.mq{overflow:hidden;white-space:nowrap;padding:5vh 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.mq .t{display:inline-flex;will-change:transform}
.mq span{font-family:var(--disp);font-weight:var(--dw);font-size:clamp(60px,11vw,190px);line-height:1;letter-spacing:var(--dls);padding-right:.35em;text-transform:var(--htt,none)}
.mq span.o{color:transparent;-webkit-text-stroke:1.5px var(--ink)}
.mq span.s{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--accent);text-transform:none}

/* ---------- story ---------- */
.story{padding:16vh 0;display:grid;grid-template-columns:1fr 1fr;gap:5vw;align-items:center}
.story .pic{position:relative;overflow:hidden;aspect-ratio:4/5;border-radius:var(--ir,0)}
.story .pic img{width:100%;height:120%;object-fit:cover;will-change:transform}
.story .pic2{position:absolute;width:42%;right:-6%;bottom:-8%;aspect-ratio:3/4;overflow:hidden;border:6px solid var(--bg);border-radius:var(--ir,0)}
.story .pic2 img{width:100%;height:100%;object-fit:cover}
.story h2{font-family:var(--disp);font-weight:var(--dw);letter-spacing:var(--dls);font-size:clamp(44px,6vw,100px);line-height:.9;margin:18px 0 26px;text-transform:var(--htt,none)}
.story h2 .serif{text-transform:none}
.story p{font-size:18px;color:var(--muted);max-width:44ch;margin-bottom:14px}
@media(max-width:860px){.story{grid-template-columns:1fr}}

/* ---------- info grid ---------- */
.info{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.info>div{padding:28px 22px 40px 0;border-right:1px solid var(--line)}
.info>div:not(:first-child){padding-left:22px}
.info>div:last-child{border-right:0}
.info h3{font-family:var(--sans);font-weight:600;font-size:19px;margin:14px 0 8px;letter-spacing:-.01em}
.info p{color:var(--muted);font-size:15px}
@media(max-width:860px){.info{grid-template-columns:1fr 1fr}.info>div{padding-left:0!important;border-right:0;border-bottom:1px solid var(--line)}}

/* ---------- big cta ---------- */
.cta{min-height:100svh;background:var(--dark);color:var(--light);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative;overflow:hidden;padding:12vh 20px}
.cta .q{font-family:var(--sans);font-weight:500;font-size:clamp(28px,3.4vw,48px);letter-spacing:-.02em;margin:18px 0 4vh}
.cta .ring{position:relative;width:min(78vw,620px);aspect-ratio:2.2/1;display:grid;place-items:center}
.cta .ring::before,.cta .ring::after{content:"";position:absolute;top:0;bottom:0;width:20%;border:1.5px solid color-mix(in srgb,var(--light) 50%,transparent);border-radius:50%}
.cta .ring::before{left:0;border-right:0;border-top-right-radius:0;border-bottom-right-radius:0}
.cta .ring::after{right:0;border-left:0;border-top-left-radius:0;border-bottom-left-radius:0}
.cta a.go{font-family:var(--disp);font-weight:var(--dw);letter-spacing:var(--dls);font-size:clamp(56px,10vw,160px);line-height:.9;display:inline-block;transition:color .4s;text-transform:var(--htt,none)}
.cta a.go:hover{color:var(--accent)}
.cta .orb{position:absolute;width:60vw;height:60vw;border-radius:50%;background:radial-gradient(circle,var(--accent) 0%,transparent 60%);opacity:.22;filter:blur(30px);pointer-events:none}
.spin{position:absolute;width:150px;height:150px;right:6vw;bottom:8vh;animation:rot 14s linear infinite}
.spin text{font-family:var(--mono);font-size:10.5px;letter-spacing:3px;fill:currentColor;text-transform:uppercase}
@keyframes rot{to{transform:rotate(360deg)}}
@media(max-width:760px){.spin{display:none}}

/* ---------- footer ---------- */
footer.ft{background:var(--dark);color:var(--light);padding:8vh 0 calc(70px + env(safe-area-inset-bottom));border-top:1px solid color-mix(in srgb,var(--light) 12%,transparent)}
footer .cols{display:grid;grid-template-columns:2fr 1fr 1fr;gap:4vw;margin-bottom:8vh}
footer .cols p{color:color-mix(in srgb,var(--light) 65%,transparent);font-size:15px}
footer .cols a{display:block;margin:4px 0}
footer .word{font-family:var(--disp);font-weight:var(--dw);letter-spacing:var(--dls);font-size:var(--wsize,19vw);line-height:.78;white-space:nowrap;text-transform:var(--htt,none);overflow:hidden}
footer .fine{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:28px;color:color-mix(in srgb,var(--light) 55%,transparent)}
@media(max-width:760px){footer .cols{grid-template-columns:1fr}}

/* ---------- reveal ---------- */
.rv{opacity:0;transform:translateY(50px);transition:opacity 1.1s var(--out),transform 1.1s var(--out)}
.rv.in{opacity:1;transform:none}
.mask{overflow:hidden;display:block}
.mask>span{display:block;transform:translateY(105%);transition:transform 1.1s var(--out)}
.in .mask>span,.mask.in>span{transform:none}

/* ---------- booking ---------- */
.book{padding:16vh 0}
.svcs{border-top:1px solid var(--line)}
.svcs button{width:100%;display:grid;grid-template-columns:50px 1fr auto auto;gap:20px;align-items:center;padding:24px 0;border-bottom:1px solid var(--line);text-align:left;transition:background .3s,padding .4s var(--out)}
.svcs button:hover{padding-left:12px}
.svcs button[aria-pressed=true]{background:var(--soft);padding-left:16px}
.svcs .nm{font-family:var(--disp);font-weight:var(--dw);font-size:clamp(26px,3.6vw,54px);letter-spacing:var(--dls);line-height:1;text-transform:var(--htt,none)}
.svcs .d{display:block;color:var(--muted);font-size:14.5px;margin-top:6px;font-family:var(--sans);text-transform:none;letter-spacing:0;font-weight:400}
.svcs .pr{font-family:var(--mono);font-size:15px}
.svcs .tm{color:var(--muted)}
@media(max-width:700px){.svcs button{grid-template-columns:30px 1fr auto}.svcs .tm{display:none}}
.when{display:grid;grid-template-columns:1.4fr 1fr;gap:4vw;margin-top:8vh;align-items:start}.when>div{min-width:0}
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.days button{flex:0 0 76px;padding:14px 6px;border:1px solid var(--line);text-align:center;border-radius:var(--ir,0)}
.days b{display:block;font-family:var(--disp);font-weight:var(--dw);font-size:28px;line-height:1.1}
.days button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.days button:disabled{opacity:.3}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:14px}
.times button{padding:12px 6px;border:1px solid var(--line);font-family:var(--mono);font-size:13px;border-radius:var(--ir,0)}
.times button[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.times button:disabled{opacity:.3;text-decoration:line-through}
.ticket{background:var(--dark);color:var(--light);padding:30px;position:sticky;top:90px;border-radius:var(--ir,0)}
.ticket h3{font-family:var(--disp);font-weight:var(--dw);font-size:40px;line-height:1;margin-bottom:18px;letter-spacing:var(--dls);text-transform:var(--htt,none)}
.ticket .r{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed color-mix(in srgb,var(--light) 25%,transparent)}
.ticket .r span:first-child{color:color-mix(in srgb,var(--light) 60%,transparent)}
.ticket .go{width:100%;margin-top:20px}
@media(max-width:860px){.when{grid-template-columns:1fr}.ticket{position:static}}

/* ---------- cake builder ---------- */
.cake{padding:16vh 0}
.cgrid{display:grid;grid-template-columns:1.1fr 1fr;gap:4vw;align-items:center}
.stage{position:relative;aspect-ratio:1/1;max-height:80vh;background:var(--dark);color:var(--light);display:flex;align-items:flex-end;justify-content:center;padding-bottom:12%;overflow:hidden;border-radius:var(--ir,0)}
.stage .lb{position:absolute;left:20px;right:20px;top:18px;display:flex;justify-content:space-between;color:color-mix(in srgb,var(--light) 65%,transparent)}
.stage .glow{position:absolute;width:80%;height:60%;bottom:0;left:10%;background:radial-gradient(ellipse at bottom,var(--accent),transparent 65%);opacity:.35}
.stage .plate{position:absolute;bottom:9%;left:50%;transform:translateX(-50%);width:70%;height:18px;border-radius:50%;background:color-mix(in srgb,var(--light) 18%,transparent)}
.cakeS{position:relative;display:flex;flex-direction:column-reverse;align-items:center;z-index:2}
.tier{height:58px;border-radius:10px 10px 4px 4px;background:var(--frost);position:relative;transition:width .6s var(--out),background .5s;animation:drop .7s var(--out);box-shadow:inset 0 -12px 0 rgba(0,0,0,.07)}
.tier::before{content:"";position:absolute;left:0;right:0;top:0;height:18px;border-radius:10px 10px 0 0;background:radial-gradient(circle at 10px 0,var(--drip) 9px,transparent 10px) 0 0/20px 18px repeat-x}
.tier::after{content:"";position:absolute;left:10%;right:10%;bottom:12px;height:4px;background:repeating-linear-gradient(90deg,var(--accent) 0 6px,transparent 6px 14px);opacity:.6}
@keyframes drop{from{transform:translateY(-160px);opacity:0}}
.topper{font-size:44px;margin-bottom:-4px;animation:drop .8s var(--out)}
.est{font-family:var(--disp);font-weight:var(--dw);font-size:clamp(54px,7vw,110px);line-height:.9;letter-spacing:var(--dls)}
.ctl{margin-bottom:24px}
.ctl>.mono{display:block;color:var(--muted);margin-bottom:10px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills button{padding:10px 16px;border:1px solid var(--line);border-radius:999px;font-size:14.5px;transition:.25s}
.pills button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stepper{display:flex;align-items:center;gap:18px}
.stepper button{width:52px;height:52px;border:1px solid var(--line);border-radius:50%;font-size:24px}
.stepper b{font-family:var(--disp);font-weight:var(--dw);font-size:48px;min-width:44px;text-align:center;line-height:1}
.sw{display:inline-flex;align-items:center;gap:12px;cursor:pointer;font-weight:600}
.sw input{appearance:none;width:52px;height:30px;border-radius:15px;background:var(--line);position:relative;transition:.3s;cursor:pointer}
.sw input::after{content:"";position:absolute;left:4px;top:4px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.3s var(--out)}
.sw input:checked{background:var(--accent)}.sw input:checked::after{left:26px}
@media(max-width:860px){.cgrid{grid-template-columns:1fr}}

/* ---------- buttons, drawer, modal ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;padding:17px 28px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:15px;transition:transform .4s var(--out),background .3s;white-space:nowrap}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;border:1px solid currentColor;color:inherit}
.btn[disabled]{opacity:.4;pointer-events:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);z-index:120;opacity:0;pointer-events:none;transition:opacity .5s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--bg);color:var(--ink);z-index:130;transform:translateX(102%);transition:transform .7s var(--ease);display:flex;flex-direction:column}
.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:22px 24px;border-bottom:1px solid var(--line)}
.dh h3{font-family:var(--disp);font-weight:var(--dw);font-size:34px;letter-spacing:var(--dls);text-transform:var(--htt,none)}
.x{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);font-size:16px}
.db{flex:1;overflow:auto;padding:20px 24px}
.df{padding:20px 24px;border-top:1px solid var(--line)}
.li{display:grid;grid-template-columns:78px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.li img{width:78px;height:100px;object-fit:cover;border-radius:var(--ir,0)}
.li h4{font-size:15.5px;font-weight:600}
.li small{color:var(--muted);display:block}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;margin-top:8px}
.qty button{width:32px;height:30px}
.row{display:flex;justify-content:space-between;margin:7px 0}
.row.tot{font-weight:700;font-size:19px;margin-top:12px}
.empty{text-align:center;padding:70px 10px;color:var(--muted)}
.empty b{display:block;font-family:var(--disp);font-weight:var(--dw);font-size:44px;color:var(--ink);margin-bottom:6px}
.field{display:block;margin-bottom:12px}
.field span{display:block;margin-bottom:6px;color:var(--muted)}
.field input,.field textarea{width:100%;padding:14px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;border-radius:var(--ir,0)}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--ink)}
.pick{display:grid;gap:8px;margin-bottom:14px}
.pick label{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);cursor:pointer;font-size:14.5px;border-radius:var(--ir,0)}
.pick label:has(input:checked){border-color:var(--ink);background:var(--soft)}
.pick label b{margin-left:auto;font-family:var(--mono);font-weight:400}
.pick input{accent-color:var(--accent)}
.steps{display:flex;gap:6px;margin-bottom:18px}
.steps i{flex:1;height:2px;background:var(--line)}.steps i.on{background:var(--ink)}
.modal{position:fixed;inset:0;z-index:140;display:grid;place-items:center;padding:14px;pointer-events:none;visibility:hidden}
.modal.on{visibility:visible}
.modal .box{pointer-events:auto;background:var(--bg);color:var(--ink);width:min(980px,100%);max-height:92vh;overflow:auto;display:grid;grid-template-columns:1fr 1fr;clip-path:inset(50% 0 50% 0);transition:clip-path .8s var(--ease);border-radius:var(--ir,0)}
.modal.on .box{clip-path:inset(0 0 0 0)}
.modal .mi img{width:100%;height:100%;object-fit:cover;max-height:92vh}
.modal .mc{padding:34px;position:relative;display:flex;flex-direction:column}
.modal .mc .x{position:absolute;right:20px;top:20px}
.modal h3{font-family:var(--disp);font-weight:var(--dw);font-size:clamp(36px,4vw,58px);line-height:.92;margin:14px 50px 12px 0;letter-spacing:var(--dls);text-transform:var(--htt,none)}
.modal .price{font-family:var(--mono);font-size:20px;margin-bottom:16px}
.modal .desc{color:var(--muted);margin-bottom:22px}
.modal .opt{margin-bottom:16px}
.modal .opt>.mono{display:block;margin-bottom:8px;color:var(--muted)}
.modal .note{font-size:13px;color:var(--muted);margin-top:14px}
@media(max-width:760px){.modal .box{grid-template-columns:1fr}.modal .mi img{max-height:44vh}}
.done{text-align:center;padding:30px 6px}
.done .tick{font-family:var(--disp);font-weight:var(--dw);font-size:96px;line-height:1;color:var(--accent)}
.done h4{font-family:var(--disp);font-weight:var(--dw);font-size:40px;line-height:1;margin:8px 0 12px;letter-spacing:var(--dls);text-transform:var(--htt,none)}
.toast{position:fixed;left:50%;top:84px;z-index:160;transform:translate(-50%,-30px);opacity:0;background:var(--ink);color:var(--bg);padding:13px 20px;border-radius:999px;font-size:14px;font-weight:600;transition:.5s var(--out);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.wa{position:fixed;right:16px;bottom:16px;z-index:86;width:54px;height:54px;border-radius:50%;background:#25D366;display:grid;place-items:center;box-shadow:0 10px 26px -8px rgba(0,0,0,.4)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv,.fade{opacity:1;transform:none}.mask>span,.hero h1 .ch{transform:none;opacity:1}}

const mani_=$$('#mani .w');const hzs=$$('.hz');const pars=$$('[data-par]');const mq=$('#mqT');let mqx=0,lastY=scrollY,vel=0;

 pars.forEach(el=>{const r=el.parentElement.getBoundingClientRect();el.style.transform='translateY('+((r.top-vh/2)*-+el.dataset.par)+'px)'});
 vel=y-lastY;lastY=y;

/* ---------- dots field ---------- */
(function(){const cv=$('#dc');if(!cv)return;const x=cv.getContext('2d');let W,H,P=[],dpr=Math.min(2,devicePixelRatio||1),mxx=-999,myy=-999,run=false;
const col=getComputedStyle(document.documentElement).getPropertyValue('--light').trim(),acc=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
function build(){W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);
 const o=document.createElement('canvas');o.width=W;o.height=H;const ox=o.getContext('2d');ox.fillStyle='#000';ox.textAlign='center';ox.textBaseline='middle';const fs=Math.min(W*.55/Math.max(1,D.dots.word.length*.62),H*.62);ox.font=getComputedStyle(document.documentElement).getPropertyValue('--dw').trim()+' '+fs+'px '+getComputedStyle(document.documentElement).getPropertyValue('--disp');ox.fillText(D.dots.word,W/2,H*.52);
 const data=ox.getImageData(0,0,W,H).data;const gap=W<700?9:12;P=[];for(let yy=0;yy<H;yy+=gap)for(let xx=0;xx<W;xx+=gap){if(data[(yy*W+xx)*4+3]>128)P.push({hx:xx,hy:yy,x:Math.random()*W,y:Math.random()*H,vx:0,vy:0,a:Math.random()<.08})}}
function draw(){if(!run)return;x.clearRect(0,0,W,H);for(const p of P){const dx=p.x-mxx,dy=p.y-myy,d2=dx*dx+dy*dy;if(d2<14000){const f=(14000-d2)/14000*6;const d=Math.sqrt(d2)||1;p.vx+=dx/d*f;p.vy+=dy/d*f}p.vx+=(p.hx-p.x)*.045;p.vy+=(p.hy-p.y)*.045;p.vx*=.82;p.vy*=.82;p.x+=p.vx;p.y+=p.vy;x.fillStyle=p.a?acc:col;x.beginPath();x.arc(p.x,p.y,p.a?2.6:1.8,0,6.283);x.fill()}requestAnimationFrame(draw)}
cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();mxx=e.clientX-r.left;myy=e.clientY-r.top});cv.addEventListener('mouseleave',()=>{mxx=myy=-999});
cv.addEventListener('touchmove',e=>{const r=cv.getBoundingClientRect();mxx=e.touches[0].clientX-r.left;myy=e.touches[0].clientY-r.top},{passive:true});cv.addEventListener('touchend',()=>{mxx=myy=-999});
document.fonts.ready.then(()=>{build();new IntersectionObserver(es=>{run=es[0].isIntersecting;if(run)draw()}).observe(cv)});addEventListener('resize',()=>{if(W!==cv.clientWidth)build()})})();

/* ---------- bag / checkout ---------- */
const cnt=()=>bag.reduce((a,b)=>a+b.q,0),tot=()=>bag.reduce((a,b)=>a+b.q*b.price,0);

if(step==='details')d.innerHTML=`<div class="dh"><h3>Delivery</h3><button class="x" data-step="bag">←</button></div><div class="db">${bar}<label class="field"><span class="mono">Full name</span><input id="cn" value="${esc(co.n||'')}" autocomplete="name"></label><label class="field"><span class="mono">Phone</span><input id="cp" type="tel" value="${esc(co.p||'')}" autocomplete="tel"></label><label class="field"><span class="mono">Address</span><textarea id="ca" rows="2">${esc(co.a||'')}</textarea></label><div class="pick">${D.delivery.map((z,i)=>`<label><input type="radio" name="dz" value="${i}" ${(co.z||0)==i?'checked':''}> ${z[0]}<b>${z[1]?money(z[1]):'Free'}</b></label>`).join('')}</div></div><div class="df"><button class="btn" style="width:100%" data-step="pay">Continue →</button></div>`;
if(step==='pay'){const z=D.delivery[co.z||0];d.innerHTML=`<div class="dh"><h3>Payment</h3><button class="x" data-step="details">←</button></div><div class="db">${bar}<div class="pick">${D.pay.map((p,i)=>`<label><input type="radio" name="pm" ${i?'':'checked'}> ${p}</label>`).join('')}</div><div class="row"><span>Items</span><span>${money(tot())}</span></div><div class="row"><span>${z[0]}</span><span>${z[1]?money(z[1]):'Free'}</span></div><div class="row tot"><span>Total</span><span>${money(tot()+z[1])}</span></div><p class="mono" style="color:var(--muted);margin-top:12px">${D.payNote}</p></div><div class="df"><button class="btn" style="width:100%" data-step="done">Pay ${money(tot()+z[1])}</button></div>`}

function quick(i){const p=D.products[i],opts=p.opts||D.defaultOpts||[],sel={};opts.forEach(o=>sel[o[0]]=0);const box=$('#mbox');box.style.gridTemplateColumns='';
const draw=()=>{const ex=opts.reduce((a,o)=>a+(o[2]?o[2][sel[o[0]]]||0:0),0);box.innerHTML=`<div class="mi"><img src="${img(p.img)}" alt="${esc(p.name)}"></div><div class="mc"><button class="x" data-close>✕</button><span class="mono" style="color:var(--muted)">${pad(i+1)} — ${esc(p.cat)}</span><h3>${esc(p.name)}</h3><div class="price">${money(p.price+ex)}</div><p class="desc">${p.desc}</p>${opts.map(o=>`<div class="opt"><span class="mono">${o[0]}</span><div class="pills">${o[1].map((v,k)=>`<button type="button" data-o="${o[0]}" data-v="${k}" aria-pressed="${sel[o[0]]===k}">${v}${o[2]&&o[2][k]?' <span style="opacity:.55">+'+money(o[2][k])+'</span>':''}</button>`).join('')}</div></div>`).join('')}<button class="btn" style="width:100%;margin-top:auto" id="addB">Add to bag — ${money(p.price+ex)}</button><p class="note">${D.quickNote}</p></div>`;
box.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{sel[b.dataset.o]=+b.dataset.v;draw()});$('#addB').onclick=()=>{add(p,opts.map(o=>o[1][sel[o[0]]]).join(' · ')||'One size',p.price+ex);closeAll()}};
draw();$('#modal').classList.add('on');$('#scrim').classList.add('on')}

let bk={s:null,d:null,t:null};
function days(){const el=$('#days');if(!el)return;const n=new Date();el.innerHTML=[...Array(14)].map((_,k)=>{const x=new Date(n);x.setDate(n.getDate()+k);return `<button type="button" data-day="${k}" ${D.closedDays.includes(x.getDay())?'disabled':''} aria-pressed="${bk.d===k}"><span class="mono">${x.toLocaleDateString('en-GB',{weekday:'short'})}</span><b>${x.getDate()}</b><span class="mono">${x.toLocaleDateString('en-GB',{month:'short'})}</span></button>`}).join('');times();ticket()}
function times(){const t=$('#times');if(bk.d===null){t.innerHTML='<p class="mono" style="grid-column:1/-1;color:var(--muted)">Pick a day to see free slots</p>';return}let h='';for(let H=D.hours[0];H<D.hours[1];H++)for(const m of[0,30]){const l=pad(H)+':'+(m?'30':'00');h+=`<button type="button" data-time="${l}" ${((H*7+m+bk.d*3)%5)===0?'disabled':''} aria-pressed="${bk.t===l}">${l}</button>`}t.innerHTML=h}

if(t.id==='bookGo'){msg(`<div class="done"><div class="tick">✓</div><h4>Booked.</h4><p style="color:var(--muted)">${D.services[bk.s].name}, ${when()}. A confirmation and reminder would go to your phone.</p><p class="mono" style="color:var(--muted);margin-top:22px">Demo only. No deposit was taken.</p></div>`);return}
